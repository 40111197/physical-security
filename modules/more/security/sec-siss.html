<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rashtriya Raksha University | Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        navy: { 950: '#060d19', 900: '#080f1e', 800: '#0a1628', 700: '#0d1d35', 600: '#112240', 500: '#172d52' },
                        brand: { blue: '#3b6ff7', indigo: '#6366f1', purple: '#8b5cf6' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../styles.css">
</head>
<body class="bg-navy-900 text-slate-200 h-screen flex flex-col font-sans overflow-hidden">
    <header class="h-13 border-b border-white/5 bg-navy-800 flex items-center justify-between px-5 z-20 shrink-0" style="height:52px;">
        <div class="flex items-center gap-3 shrink-0 w-auto whitespace-nowrap">
            <a href="../../../index.html" class="flex items-center gap-3">
                <img src="https://upload.wikimedia.org/wikipedia/en/b/bc/Rashtriya_Raksha_University_logo.png" alt="RRU Logo" class="h-8 object-contain">
                <span class="font-bold text-sm tracking-wide text-white">Rashtriya Raksha University</span>
            </a>
        </div>
        <nav class="hidden md:flex flex-1 items-center gap-1 mx-4" id="topNav"></nav>
        <div class="flex items-center gap-2 shrink-0">
            <div class="w-7 h-7 rounded-full bg-gradient-to-br from-brand-blue to-brand-purple flex items-center justify-center text-[10px] font-bold text-white border-2 border-white/10 cursor-pointer">RRU</div>
        </div>
    </header>
    <div class="flex flex-1 overflow-hidden">
        <aside id="sidebar" class="w-14 flex flex-col items-center pt-3 pb-3 gap-0.5 z-10 shrink-0 bg-transparent"></aside>
        <main class="flex-1 overflow-y-auto custom-scrollbar bg-navy-900 flex flex-col p-5 lg:p-6" id="mainContent"></main>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../../app.js"></script>
</body>
</html>
